# 이 파일을 그대로 복사해서 Portainer의 "Web editor"에 붙여넣거나, 같은 내용을
# docker-compose.yml로 저장해서 CLI에서 `docker compose up -d`로 실행하세요.
#
# 아래에서 "# <-- 여기 수정" 표시가 붙은 줄만 실제 값으로 고치면 바로 씁니다.
# 별도로 .env 파일이나 Portainer의 Environment variables를 채울 필요가 없습니다.
#
# 자동 업데이트: webtoon-server의 labels에 있는
# com.centurylinklabs.watchtower.enable=true 는 Watchtower용 표시입니다. 이미
# Watchtower를 쓰고 계시면 --label-enable 옵션이 켜져 있는 한 자동으로 인식되어 새
# 이미지가 올라올 때마다 갱신됩니다. Watchtower가 없다면 이 라벨은 그냥 무시되니
# 지우지 않아도 되고, 필요할 때 Watchtower(https://containrrr.dev/watchtower/)를
# 따로 띄우기만 하면 됩니다.

services:
  webtoon-server:
    image: ghcr.io/murianwind/webtoon-server:latest
    container_name: webtoon-server
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"                                    # <-- 여기 수정: 왼쪽 숫자만 원하는 포트로
    environment:
      - "PUBLIC_BASE_URL="                              # <-- 여기 수정(선택): 외부 알림 링크가 필요할 때만 도메인 입력
      - "RESCAN_INTERVAL_SECONDS=7200"                  # <-- 여기 수정(선택): 자동 재스캔 주기(초)
    volumes:
      # 플랫폼 폴더는 원하는 만큼 자유롭게 추가/삭제 가능합니다. 자세한 설명은
      # README의 "웹툰 폴더 여러 개 추가하기" 섹션을 참고하세요.
      - "/path/to/your/naver-webtoons:/library/naver"   # <-- 여기 수정: 실제 웹툰 폴더 경로
      - "/path/to/your/kakao-webtoons:/library/kakao"   # <-- 여기 수정: 실제 웹툰 폴더 경로
      - "webtoon_data:/data"
    restart: unless-stopped

volumes:
  webtoon_data:
