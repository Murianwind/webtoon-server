services:
  webtoon-server:
    build: .
    container_name: webtoon-server
    ports:
      - "25601:8000"
    volumes:
      # 왼쪽(호스트 경로)을 실제 PC 폴더로 맞춰주세요.
      # 오른쪽(/library/<플랫폼명>)은 코드가 "플랫폼 폴더"로 인식하는 이름입니다.
      - "D:/Downloads/Webtoon/Webtoon_Download:/library/naver"
      - "D:/Downloads/Webtoon/카카오 웹툰:/library/kakao"
    restart: unless-stopped
