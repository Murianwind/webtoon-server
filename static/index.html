<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 웹툰</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>내 웹툰</h1>
</header>
<div class="toolbar">
  <input id="searchInput" class="search-input" type="text" placeholder="제목 검색">
  <select id="sortSelect" class="sort-select">
    <option value="latest">최근 업데이트순</option>
    <option value="unread">안읽은 회차 많은순</option>
    <option value="title">제목순</option>
  </select>
</div>
<div id="filterTabs" class="filter-tabs"></div>

<div id="readActionPanel" class="read-action-panel" style="display:none">
  <div class="read-action-header">
    <span id="readActionTitle"></span>
    <button id="readActionClose" class="read-action-close" aria-label="닫기">×</button>
  </div>
  <div id="readActionBody"></div>
</div>

<main id="grid" class="grid"></main>

<script>
const PLATFORM_LABEL = { naver: "네이버", kakao: "카카오" };
const LS_QUERY = "webtoon:index:query";
const LS_SORT = "webtoon:index:sort";
const FILTER_KEY = "status_filter"; // 서버(app_settings)에 저장 -> 모든 기기에서 동일하게 적용
const FILTER_OPTIONS = [
  { value: "all", label: "전체" },
  { value: "unread", label: "읽지 않음" },
  { value: "reading", label: "읽는 중" },
  { value: "done", label: "완독" },
];

let allSeries = [];
let query = localStorage.getItem(LS_QUERY) || "";
let sortMode = localStorage.getItem(LS_SORT) || "latest";
let filterMode = "all"; // 서버에서 로드되기 전까지의 기본값

let selectedSeriesId = null;
let selectedSeriesTitle = null;
let actionMode = null; // null | "chapter-read" | "chapter-unread"

const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
searchInput.value = query;
sortSelect.value = sortMode;

function sortSeries(list) {
  const arr = [...list];
  if (sortMode === "latest") arr.sort((a, b) => b.latest_update - a.latest_update);
  else if (sortMode === "unread") arr.sort((a, b) => b.unread_count - a.unread_count);
  else if (sortMode === "title") arr.sort((a, b) => a.title.localeCompare(b.title, "ko"));
  return arr;
}

function seriesStatus(s) {
  if (s.unread_count >= s.chapter_count) return "unread"; // 아직 한 번도 안 읽음
  if (s.unread_count === 0) return "done"; // 전부 읽음
  return "reading"; // 일부만 읽음
}

function renderFilterTabs() {
  const container = document.getElementById("filterTabs");
  container.innerHTML = "";
  for (const opt of FILTER_OPTIONS) {
    const btn = document.createElement("button");
    btn.className = "filter-tab" + (filterMode === opt.value ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      if (filterMode === opt.value) return;
      filterMode = opt.value;
      renderFilterTabs();
      render();
      fetch(`/api/settings/${FILTER_KEY}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: filterMode }),
      }).catch(() => {});
    });
    container.appendChild(btn);
  }
}

function render() {
  const grid = document.getElementById("grid");
  const q = query.trim().toLowerCase();
  let filtered = q ? allSeries.filter((s) => s.title.toLowerCase().includes(q)) : allSeries;
  if (filterMode !== "all") {
    filtered = filtered.filter((s) => seriesStatus(s) === filterMode);
  }
  const list = sortSeries(filtered);

  if (!list.length) {
    const msg = q
      ? "검색 결과가 없습니다."
      : filterMode !== "all"
      ? "해당하는 웹툰이 없습니다."
      : "스캔된 웹툰이 없습니다.<br>라이브러리 폴더를 확인해주세요.";
    grid.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }

  grid.innerHTML = "";
  for (const s of list) {
    const isSelected = s.id === selectedSeriesId;
    const card = document.createElement("div");
    card.className = "card" + (isSelected ? " selected" : "");
    card.innerHTML = `
      <div class="cover-wrap">
        <span class="platform-tag">${PLATFORM_LABEL[s.platform] || s.platform}</span>
        ${s.unread_count > 0 ? `<span class="unread-badge">${s.unread_count}</span>` : ""}
        <img src="${s.cover_url}" alt="${s.title}" loading="lazy">
        <button class="select-toggle" title="읽음 상태 관리" aria-label="읽음 상태 관리">${isSelected ? "●" : "○"}</button>
      </div>
      <div class="title">${s.title}</div>
      <div class="chapter-count">${s.chapter_count}화</div>
    `;
    card.querySelector(".select-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      if (selectedSeriesId === s.id) {
        deselectSeries();
      } else {
        selectedSeriesId = s.id;
        selectedSeriesTitle = s.title;
        actionMode = null;
        renderActionPanel();
      }
      render();
    });
    card.addEventListener("click", () => goContinue(s.id));
    grid.appendChild(card);
  }
}

async function goContinue(seriesId) {
  try {
    const res = await fetch(`/api/series/${encodeURIComponent(seriesId)}/continue`);
    if (!res.ok) throw new Error("continue lookup failed");
    const data = await res.json();
    location.href = `/reader.html?series=${encodeURIComponent(seriesId)}&chapter=${encodeURIComponent(data.chapter_id)}&page=${data.page_index}`;
  } catch (e) {
    // 이동 실패 시 아무것도 하지 않음 (콘솔에만 남김)
    console.error(e);
  }
}

// ---------------------------------------------------------------------
// 읽음/안읽음 처리 패널
// ---------------------------------------------------------------------

function deselectSeries() {
  selectedSeriesId = null;
  selectedSeriesTitle = null;
  actionMode = null;
  renderActionPanel();
}

function renderActionPanel() {
  const panel = document.getElementById("readActionPanel");
  if (!selectedSeriesId) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";
  document.getElementById("readActionTitle").textContent = selectedSeriesTitle;
  const body = document.getElementById("readActionBody");

  if (!actionMode) {
    body.innerHTML = `
      <div class="read-action-grid">
        <button data-act="all-read">전체 읽음으로 표시</button>
        <button data-act="all-unread">전체 읽지 않음으로 표시</button>
        <button data-act="chapter-read">회차 읽음으로 표시</button>
        <button data-act="chapter-unread">회차 읽지 않음으로 표시</button>
      </div>
    `;
    for (const btn of body.querySelectorAll("button[data-act]")) {
      btn.addEventListener("click", () => onActionButton(btn.dataset.act));
    }
  } else {
    body.innerHTML = `
      <div class="read-action-picker">
        <select id="chapterPickerSelect"><option>회차 불러오는 중...</option></select>
        <div class="read-action-picker-buttons">
          <button id="chapterPickerCancel" class="ghost">뒤로</button>
          <button id="chapterPickerApply">적용</button>
        </div>
      </div>
    `;
    loadChapterOptions();
    document.getElementById("chapterPickerCancel").addEventListener("click", () => {
      actionMode = null;
      renderActionPanel();
    });
    document.getElementById("chapterPickerApply").addEventListener("click", applyChapterAction);
  }
}

async function loadChapterOptions() {
  const res = await fetch(`/api/series/${encodeURIComponent(selectedSeriesId)}/chapters`);
  const data = await res.json();
  const select = document.getElementById("chapterPickerSelect");
  if (!select) return; // 그 사이 패널이 닫혔을 수 있음
  select.innerHTML = data.chapters
    .map((c) => `<option value="${c.id}">${c.label}${c.read ? " (읽음)" : ""}</option>`)
    .join("");
}

async function putReadState(body) {
  await fetch(`/api/series/${encodeURIComponent(selectedSeriesId)}/read-state`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

async function onActionButton(act) {
  if (act === "all-read" || act === "all-unread") {
    await putReadState({ scope: "all", read: act === "all-read" });
    deselectSeries();
    await load();
  } else {
    actionMode = act;
    renderActionPanel();
  }
}

async function applyChapterAction() {
  const select = document.getElementById("chapterPickerSelect");
  if (!select || !select.value) return;
  const read = actionMode === "chapter-read";
  await putReadState({ scope: "chapter", chapter_id: select.value, read });
  deselectSeries();
  await load();
}

document.getElementById("readActionClose").addEventListener("click", deselectSeries);

// ---------------------------------------------------------------------
// 로딩 & 검색/정렬 (localStorage에 유지)
// ---------------------------------------------------------------------

async function loadFilterSetting() {
  try {
    const res = await fetch(`/api/settings/${FILTER_KEY}`);
    const data = await res.json();
    if (data.value && FILTER_OPTIONS.some((o) => o.value === data.value)) {
      filterMode = data.value;
    }
  } catch (e) {
    // 실패 시 기본값(전체) 유지
  }
}

async function fetchSeries() {
  const grid = document.getElementById("grid");
  try {
    const res = await fetch("/api/series");
    allSeries = await res.json();
    return true;
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">목록을 불러오지 못했습니다.</div>`;
    return false;
  }
}

async function load() {
  const ok = await fetchSeries();
  if (ok) render();
}

async function init() {
  renderFilterTabs(); // 기본값(전체)으로 우선 표시
  const [ok] = await Promise.all([fetchSeries(), loadFilterSetting()]);
  renderFilterTabs(); // 서버 값 반영해서 다시 그림
  if (ok) render();
}

searchInput.addEventListener("input", (e) => {
  query = e.target.value;
  localStorage.setItem(LS_QUERY, query);
  render();
});
sortSelect.addEventListener("change", (e) => {
  sortMode = e.target.value;
  localStorage.setItem(LS_SORT, sortMode);
  render();
});

init();
</script>
</body>
</html>
