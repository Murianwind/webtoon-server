# 로컬에서 직접 빌드하지 않고, GitHub Actions가 미리 빌드해서 GHCR에 올려둔
# 이미지를 pull해서 쓰는 버전입니다. Watchtower와 함께 쓰면 저장소가 업데이트될
# 때마다 자동으로 이미지를 받아서 재시작합니다.
#
# 사용법: Portainer에서 스택 생성 시 Compose path를 이 파일(docker-compose.ghcr.yml)로
# 지정하면 됩니다. 필요한 환경변수는 docker-compose.yml과 동일합니다.
#
# 이미지 경로의 OWNER 부분은 저장소를 fork했다면 자신의 GitHub 계정명으로 바꿔주세요.

services:
  webtoon-server:
    image: ghcr.io/murianwind/webtoon-server:latest
    container_name: webtoon-server
    labels:
      # Watchtower가 --label-enable 옵션으로 켜져 있을 때, 이 라벨이 붙은
      # 컨테이너만 자동 업데이트 대상으로 삼는다.
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - "PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}"
      - "RESCAN_INTERVAL_SECONDS=${RESCAN_INTERVAL_SECONDS:-7200}"
    volumes:
      - "${LIBRARY_NAVER_PATH}:/library/naver"
      - "${LIBRARY_KAKAO_PATH}:/library/kakao"
      - "webtoon_data:/data"
    restart: unless-stopped

  # 선택사항: 이미 다른 Watchtower를 운영 중이라면 이 서비스는 빼도 됩니다.
  watchtower:
    image: containrrr/watchtower
    container_name: webtoon-server-watchtower
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    # 1시간마다 새 이미지가 있는지 확인, --label-enable로 라벨 붙은 컨테이너만 대상,
    # --cleanup으로 옛날 이미지는 자동 정리
    command: --interval 3600 --label-enable --cleanup
    restart: unless-stopped

volumes:
  webtoon_data:
